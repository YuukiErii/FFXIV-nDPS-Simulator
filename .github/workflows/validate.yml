name: Validate

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  source-and-ui:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt
      - run: python -m pip install -r requirements.txt
      - run: python -m unittest discover -s tests -v
      - run: python scripts/smoke_damage_formula.py
      - run: python scripts/scan_skill_coverage.py examples/skill_lines --issues-only --show-skills
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/ndps-ui/package-lock.json
      - run: npm ci
        working-directory: apps/ndps-ui
      - run: npm run build
        working-directory: apps/ndps-ui
